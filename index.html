<!DOCTYPE html>
<html lang="ps" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1a33"><link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>پامیر پوهنتون | Pamir University</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a1a33;--c:#13294d;--c2:#1b3a68;--g:#1fa35a;--o:#f2c04a;--t:#eef3fb;--m:#9fb2cf;--r:#d9433b}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.6 Tahoma,"Noto Naskh Arabic","Segoe UI",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:520px;margin:auto;padding:12px}
h1,h2,h3{margin:.3em 0}
.card{background:var(--c);border-radius:16px;padding:12px;margin:10px 0;border:1px solid #ffffff14}
.b{display:block;width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:700;color:#fff;background:var(--c2);cursor:pointer}
.b:active{transform:scale(.97)}
.b.g{background:var(--g)}.b.o{background:var(--o);color:#1a1a1a}.b.r{background:var(--r)}.b.s{padding:8px;font-size:14px}
.grid{display:grid;gap:8px;grid-template-columns:repeat(3,1fr)}
.grid .b{font-size:26px;padding:18px 0}
.grid .b.s{font-size:14px;padding:12px 2px}
input,select,textarea{width:100%;background:#0c1f3d;color:var(--t);border:1px solid #ffffff30;border-radius:10px;padding:10px;font:inherit}
label{display:block;margin:8px 0 3px;color:var(--m);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0}
td,th{padding:5px 3px;text-align:center;border-bottom:1px solid #ffffff12}
td:first-child,th:first-child{text-align:right}
.big{font-size:46px;font-weight:800;color:var(--o);direction:ltr;text-align:center;line-height:1.2}
.mut{color:var(--m);font-size:13px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.chip{display:inline-flex;min-width:32px;height:32px;border-radius:16px;background:var(--c2);align-items:center;justify-content:center;margin:2px;font-size:13px;font-weight:700;padding:0 8px;cursor:pointer}
.chip.w{background:var(--r)}.chip.f{background:var(--g)}.chip.x{background:var(--o);color:#111}
.mod{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.mod>div{background:var(--bg);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px;border:1px solid var(--o)}
.mod .b{margin:5px 0}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}

.uni-logo{width:112px;height:112px;object-fit:contain;border-radius:50%;background:#fff;border:3px solid var(--o);padding:3px}
.about-head{display:flex;align-items:center;gap:14px}
.about-photo{width:104px;height:124px;object-fit:cover;object-position:center 35%;border-radius:14px;border:2px solid var(--o);flex:0 0 104px}
.about-name{font-size:18px;font-weight:800;color:var(--o)}
.contact-line{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #ffffff18}
.contact-line a{color:#fff;text-decoration:none;direction:ltr;unicode-bidi:isolate;font-weight:700}
</style></head><body><div id="app"></div>

const cm=()=>S.m.find(m=>m.id===S.cur),ci=m=>m.inn[m.ci];
const ov=b=>Math.floor(b/6)+'.'+b%6;

const LOGO=`<svg viewBox="0 0 120 120" width="92" height="92"><circle cx="60" cy="60" r="56" fill="#13294d" stroke="#f2c04a" stroke-width="4"/><g transform="rotate(28 60 60)"><rect x="52" y="12" width="16" height="52" rx="5" fill="#e8c27a"/><rect x="57" y="62" width="6" height="26" rx="3" fill="#8a5a2b"/></g><circle cx="86" cy="80" r="11" fill="#d9433b"/><path d="M77 76q9 4 18 8" stroke="#fff" fill="none"/><g stroke="#1fa35a" stroke-width="4" stroke-linecap="round"><path d="M26 100V70M37 100V70M48 100V70"/></g><path d="M24 68h26" stroke="#f2c04a" stroke-width="3"/></svg>`;

const bl=(n,p)=>{let b=0,r=0,w=0;n.log.forEach(e=>{if(e.w!==p)return;if(e.t!=='wd'&&e.t!=='nb')b++;r+=e.r+(e.t==='b'||e.t==='lb'?0:e.x);if(e.k&&e.k.h!=='Run Out')w++});return{b,r,w}};
const extras=n=>n.log.reduce((a,e)=>a+e.x,0);
const eco=o=>o.b?(o.r*6/o.b).toFixed(1):'-';

 const kw=B.n+'|'+B.p[e.w],o=bowl[kw]||(bowl[kw]={n:B.p[e.w],t:B.n,b:0,r:0,w:0});if(e.t!=='wd'&&e.t!=='nb')o.b++;o.r+=e.r+(e.t==='b'||e.t==='lb'?0:e.x);if(e.k&&e.k.h!=='Run Out')o.w++})});return{bat,bowl}}
const go=(v,id)=>{V.v=v;V.id=id||null;V.md=null;R();scrollTo(0,0)};

 if(v==='home')h=home();else if(v==='setup')h=setup();else if(v==='score')h=score(m);else if(v==='hist')h=hist();else if(v==='stats')h=stats();else if(v==='card')h=card(S.m.find(x=>x.id===V.id));
 $('app').innerHTML=h+modal()}

const setup=()=>`<h2>نوې لوبه</h2><div class="card">${[1,2].map(i=>`<label>${i==1?'لومړی':'دویم'} ټیم</label><input id="tn${i}" placeholder="نوم / Team ${i}"><label>لوګو (اختیاري)</label><div class="row"><input type="file" accept="image/*" data-lg="${i-1}"><img id="lg${i-1}" width="40" height="40" style="flex:0 0 40px;border-radius:50%;display:none"></div><label>لوبغاړي (په هره کرښه کې یو نوم)</label><textarea id="pl${i}" rows="6"></textarea>`).join('')}

const chip=e=>{const s=e.k?'W':e.t==='wd'?'Wd'+(e.x>1?'+'+(e.x-1):''):e.t==='nb'?'Nb'+(e.r?'+'+e.r:''):e.t==='b'?'B'+e.x:e.t==='lb'?'Lb'+e.x:e.r;return `<span class="chip ${e.k?'w':e.r>=4?'f':e.t?'x':''}">${s}</span>`};
function score(m){if(!m)return home();if(m.stat==='done')return card(m);
 const n=ci(m),T=m.t[n.bat],B=m.t[n.bowl],left=m.ov*6-n.balls;
 if(m.stat==='brk')return `<div class="card" style="text-align:center"><h2>لومړی اینینګ پای ته ورسید</h2><div class="big">${n.runs}/${n.wk}</div><p>${esc(T.n)}<br>هدف: <b class="num">${n.runs+1}</b></p></div><button class="b g" data-a="inn2">دویم اینینګ پیل کړئ</button><button class="b" data-a="undo" style="margin-top:8px">↩ وروستی بال بیرته</button>${nav()}`;
 const bt=p=>{if(p==null)return '-';const s=bs(n,p);return `${esc(T.p[p])} <b class="num">${s.r}</b> <span class="mut num">(${s.b})</span>`};
 const bo=n.bw!=null?bl(n,n.bw):null,crr=n.balls?(n.runs*6/n.balls).toFixed(2):'0.00';let tg='';
 if(m.ci){const t=m.inn[0].runs+1,nd=t-n.runs;tg=`<div class="card row" style="text-align:center"><div>هدف<br><b class="num">${t}</b></div><div>اړتیا<br><b class="num">${nd} / ${left}</b></div><div>RRR<br><b class="num">${left>0?(nd*6/left).toFixed(2):'-'}</b></div></div>`}
 return `<div class="row mut"><span>${esc(T.n)} 🏏 ${esc(B.n)}</span><span style="text-align:left">اینینګ ${m.ci+1}</span></div>
<div class="card"><div class="big">${n.runs}/${n.wk}</div><div class="row" style="text-align:center"><div>اوورونه<br><b class="num">${ov(n.balls)}/${m.ov}</b></div><div>CRR<br><b class="num">${crr}</b></div><div>اضافي<br><b class="num">${extras(n)}</b></div></div></div>${tg}
<div class="card"><div>🏏 ${bt(n.st)} ★</div><div>🏏 ${bt(n.ns)}</div><div style="margin-top:6px">⚾ ${bo?esc(B.p[n.bw])+` <b class="num">${ov(bo.b)}-${bo.r}-${bo.w}</b>`:'-'}</div><div style="direction:ltr;margin-top:6px">${n.log.slice(-8).map(chip).join('')}</div></div>

<button class="b r" data-a="wk" style="margin:8px 0;font-size:20px">WICKET — ویکټ</button>

<label>تبصره (اختیاري) — د راتلونکي بال سره خوندي کیږي</label><input id="cm" value="${esc(V.cm)}"><div>${['ښکلی شاټ!','څومره ښه شپږ!','ښه بالینګ!','ویکټ ولوېد!'].map(s=>`<span class="chip" data-a="cmx" data-v="${s}">${s}</span>`).join('')}</div>
<button class="b" data-a="undo" style="margin:8px 0">↩ وروستی بال بیرته (UNDO)</button><button class="b s" data-a="endi">اینینګ ختم کړئ</button>${nav()}`}
function modal(){const m=cm();let c='';
 if(V.v==='score'&&m&&m.stat==='live'){const n=ci(m),T=m.t[n.bat],B=m.t[n.bowl],op=(P,s)=>P.map((p,i)=>`<option value="${i}"${i===s?' selected':''}>${esc(p)}</option>`).join('');
  if(n.open)c=`<h3>پیل کوونکي وټاکئ</h3><label>سټرایکر (Striker)</label><select id="o1">${op(T.p,0)}</select><label>نان-سټرایکر</label><select id="o2">${op(T.p,1)}</select><label>بالر (Bowler)</label><select id="o3">${op(B.p,0)}</select><button class="b g" style="margin-top:12px" data-a="openok">تایید</button>`;
  else if(n.nb){const out=n.log.filter(e=>e.k).map(e=>e.k.o);c='<h3>نوی بیټسمین وټاکئ</h3>'+T.p.map((p,i)=>out.includes(i)||i===n.st||i===n.ns?'':`<button class="b" data-a="pb" data-v="${i}">${esc(p)}</button>`).join('')}
  else if(n.nbw)c='<h3>راتلونکی بالر وټاکئ</h3>'+B.p.map((p,i)=>{if(i===n.lb)return '';const s=bl(n,i);return `<button class="b" data-a="pw" data-v="${i}">${esc(p)} <span class="mut num">${ov(s.b)}-${s.r}-${s.w}</span></button>`}).join('');
  else if(V.md&&V.md.k==='x'){const t=V.md.t,o=t==='wd'?[0,1,2,3,4]:t==='nb'?[0,1,2,3,4,6]:[1,2,3,4];c=`<h3>${{wd:'Wide — اضافي منډې',nb:'No Ball — د بیټ منډې',b:'Bye — منډې',lb:'Leg Bye — منډې'}[t]}</h3><div class="grid">${o.map(r=>`<button class="b g" data-a="xr" data-v="${r}">${r}</button>`).join('')}</div><button class="b s" data-a="mc">لغوه</button>`}
  else if(V.md&&V.md.k==='w'){const w=V.w,sel=(k,x)=>k===x?'o':'';c=`<h3>ویکټ</h3><div class="grid">${['Bowled','Caught','LBW','Stumped','Hit Wicket','Run Out'].map(h=>`<button class="b s ${sel(w.h,h)}" data-a="wh" data-v="${h}">${h}</button>`).join('')}</div>`+(w.h==='Run Out'?`<label>څوک آوټ شو؟</label><div class="row"><button class="b s ${sel(w.o,'st')}" data-a="wo" data-v="st">${esc(T.p[n.st])}</button><button class="b s ${sel(w.o,'ns')}" data-a="wo" data-v="ns">${esc(T.p[n.ns])}</button></div><label>بشپړې منډې</label><div class="row">${[0,1,2,3].map(r=>`<button class="b s ${w.r===r?'o':''}" data-a="wr" data-v="${r}">${r}</button>`).join('')}</div>`:'')+`<button class="b r" style="margin-top:12px" data-a="wok">تایید</button><button class="b s" data-a="mc">لغوه</button>`}}
 return c?`<div class="mod"><div>${c}</div></div>`:''}
function endInn(m){if(m.ci===0)m.stat='brk';else{const a=m.inn[0],b=m.inn[1];m.stat='done';m.win=b.runs>a.runs?b.bat:b.runs<a.runs?a.bat:-1;
 m.res=m.win<0?'لوبه برابره شوه (Tie)':m.t[m.win].n+(m.win===b.bat?' په '+(m.t[b.bat].p.length-1-b.wk)+' ویکټونو':' په '+(a.runs-b.runs)+' منډو')+' وګټله'}}
function ball(t,r,x,k){const m=cm(),n=ci(m);if(n.done||n.open||n.nb||n.nbw)return;
 m.h.push(JSON.stringify({inn:m.inn,ci:m.ci,stat:m.stat,win:m.win,res:m.res}));if(m.h.length>15)m.h.shift();
 const lg=t!=='wd'&&t!=='nb',bb=n.balls,e={b:n.st,w:n.bw,t,r,x,ov:Math.floor(bb/6)+'.'+(bb%6+(lg?1:0)),c:V.cm.trim()||undefined};V.cm='';
 if(k){e.k=k;n.wk++}
 n.log.push(e);n.runs+=r+x;if(lg)n.balls++;
 const rot=t==='wd'?x-1:(t==='b'||t==='lb')?x:r;if(rot%2){[n.st,n.ns]=[n.ns,n.st]}
 if(k){if(n.st===k.o)n.st=null;else n.ns=null;n.nb=1}
 if(lg&&n.balls%6===0){[n.st,n.ns]=[n.ns,n.st];n.lb=n.bw;n.bw=null;n.nbw=1}
 if(n.wk>=m.t[n.bat].p.length-1||n.balls>=m.ov*6||(m.ci&&n.runs>m.inn[0].runs)){n.done=1;n.nb=n.nbw=0;endInn(m)}
 sv();R()}
const A={
 go:v=>go(v),cardc(){go('card',S.cur)},view:v=>go('card',+v),res(v){S.cur=+v;sv();go('score')},
 new(){V.logo=[null,null];go('setup')},mc(){V.md=null;R()},
 del(v){if(confirm('دا لوبه به حذف شي. ډاډه یاست؟')){S.m=S.m.filter(m=>m.id!==+v);if(S.cur===+v)S.cur=null;sv();R()}},
 wipe(){if(confirm('ټول معلومات به حذف شي. ډاډه یاست؟')&&confirm('بیا هم ډاډه یاست؟ دا بیرته نه راځي.')){S={m:[],cur:null};sv();go('home')}},
 start(){const n=i=>$('tn'+i).value.trim()||'Team '+i,p=i=>$('pl'+i).value.split('\n').map(s=>s.trim()).filter(Boolean),P=[p(1),p(2)],o=+$('ov').value;
  if(P[0].length<2||P[1].length<2)return alert('هر ټیم لږ تر لږه ۲ لوبغاړي ولري');
  if(P.some(a=>new Set(a).size<a.length))return alert('په یو ټیم کې نومونه نه شي تکرارېدلی');
  if(!(o>=1&&o<=50))return alert('اوورونه ۱ څخه تر ۵۰ پورې ولیکئ');
  const b=+$('bt').value,m={id:Date.now(),d:new Date().toISOString(),ov:Math.floor(o),t:[{n:n(1),l:V.logo[0],p:P[0]},{n:n(2),l:V.logo[1],p:P[1]}],ci:0,stat:'live',h:[],inn:[mk(b,1-b)]};
  S.m.push(m);S.cur=m.id;V.cm='';sv();go('score')},
 openok(){const n=ci(cm()),a=+$('o1').value,b=+$('o2').value;if(a===b)return alert('دوه بیټسمین باید جلا وي');n.st=a;n.ns=b;n.bw=+$('o3').value;n.open=0;sv();R()},
 pb(v){const n=ci(cm());if(n.st==null)n.st=+v;else n.ns=+v;n.nb=0;sv();R()},
 pw(v){const n=ci(cm());n.bw=+v;n.nbw=0;sv();R()},
 r:v=>ball('',+v,0),x(v){V.md={k:'x',t:v};R()},
 xr(v){const t=V.md.t,r=+v;V.md=null;t==='wd'?ball('wd',0,1+r):t==='nb'?ball('nb',r,1):ball(t,0,r)},
 wk(){V.md={k:'w'};V.w={h:'Bowled',o:'st',r:0};R()},wh(v){V.w.h=v;R()},wo(v){V.w.o=v;R()},wr(v){V.w.r=+v;R()},
 wok(){const n=ci(cm()),w=V.w,ro=w.h==='Run Out',o=ro&&w.o==='ns'?n.ns:n.st;V.md=null;ball('',ro?w.r:0,0,{o,h:w.h})},
 cmx(v){V.cm=v;R()},
 inn2(){const m=cm(),a=m.inn[0];m.inn.push(mk(a.bowl,a.bat));m.ci=1;m.stat='live';sv();R()},
 endi(){if(!confirm('اینینګ ختم شي؟'))return;const m=cm(),n=ci(m);m.h.push(JSON.stringify({inn:m.inn,ci:m.ci,stat:m.stat,win:m.win,res:m.res}));n.done=1;n.nb=n.nbw=0;endInn(m);sv();R()},
 undo(){const m=cm();if(!m||!m.h.length)return alert('بیرته کولو لپاره څه نشته');if(!confirm('وروستی بال بیرته شي؟'))return;const s=JSON.parse(m.h.pop());m.inn=s.inn;m.ci=s.ci;m.stat=s.stat;m.win=s.win;m.res=s.res;V.v='score';V.md=null;sv();R()}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset.v)});
document.addEventListener('input',e=>{if(e.target.id==='cm')V.cm=e.target.value});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.mid){const m=S.m.find(x=>x.id===+t.dataset.mid);if(m){m.mom=t.value;sv()}return}
 const f=t.files&&t.files[0],i=t.dataset.lg;if(!f||i==null)return;const im=new Image();
 im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=96;c.getContext('2d').drawImage(im,0,0,96,96);V.logo[i]=c.toDataURL('image/jpeg',.8);const g=$('lg'+i);g.src=V.logo[i];g.style.display='block'};im.src=URL.createObjectURL(f)});
function card(m){if(!m)return home();const c=m.stat==='done';
 let h=`<h2>${m.t.map(t=>(t.l?`<img src="${t.l}" width="26" height="26" style="border-radius:50%;vertical-align:middle"> `:'')+esc(t.n)).join(' v ')}</h2><div class="mut">${new Date(m.d).toLocaleDateString()} · ${m.ov} اوورونه</div>`;
 if(c){const g=agg(m),bb=Object.values(g.bat).sort((a,b)=>b.r-a.r||a.b-b.b)[0],bw=Object.values(g.bowl).sort((a,b)=>b.w-a.w||a.r-b.r)[0],ps=[];m.t.forEach(t=>t.p.forEach(p=>ps.push(p+' ('+t.n+')')));
  h+=`<div class="card" style="text-align:center;border-color:var(--o)"><h3 style="color:var(--o)">🏆 ${esc(m.res)}</h3>${m.inn.map(n=>`<div>${esc(m.t[n.bat].n)}: <b class="num">${n.runs}/${n.wk}</b> <span class="mut num">(${ov(n.balls)})</span></div>`).join('')}
<p>🏏 غوره بیټسمین: ${bb?esc(bb.n)+` <b class="num">${bb.r}(${bb.b})</b>`:'-'}<br>⚾ غوره بالر: ${bw?esc(bw.n)+` <b class="num">${bw.w}/${bw.r}</b>`:'-'}</p>
<label>د لوبې غوره لوبغاړی (Player of the Match)</label><select data-mid="${m.id}"><option value="">— وټاکئ —</option>${ps.map(p=>`<option${m.mom===p?' selected':''}>${esc(p)}</option>`).join('')}</select></div>`;
  if(m.id===S.cur&&m.h&&m.h.length)h+=`<button class="b s" data-a="undo">↩ د وروستي بال سمون (Undo)</button>`}
 m.inn.forEach((n,i)=>{const T=m.t[n.bat],B=m.t[n.bowl],outs=n.log.filter(e=>e.k),set=new Set([...n.log.map(e=>e.b),...outs.map(e=>e.k.o)]);[n.st,n.ns].forEach(x=>x!=null&&set.add(x));
  h+=`<div class="card"><h3>${esc(T.n)} — <span class="num">${n.runs}/${n.wk}</span> <span class="mut num">(${ov(n.balls)})</span></h3><table><tr><th>بیټسمین</th><th>R</th><th>B</th><th>4s</th><th>6s</th></tr>`;
  [...set].sort((a,b)=>a-b).forEach(p=>{const s=bs(n,p),o=outs.find(e=>e.k.o===p);h+=`<tr><td>${esc(T.p[p])}<div class="mut num">${o?o.k.h+(o.k.h==='Run Out'?'':' b '+esc(B.p[o.w])):'not out'}</div></td><td><b>${s.r}</b></td><td>${s.b}</td><td>${s.f}</td><td>${s.s}</td></tr>`});
  h+=`</table><div class="mut">Extras: ${extras(n)}</div><table><tr><th>بالر</th><th>O</th><th>R</th><th>W</th><th>Eco</th></tr>`;
  [...new Set(n.log.map(e=>e.w))].forEach(p=>{const s=bl(n,p);h+=`<tr><td>${esc(B.p[p])}</td><td>${ov(s.b)}</td><td>${s.r}</td><td>${s.w}</td><td>${eco(s)}</td></tr>`});
  h+='</table>';const cs=n.log.filter(e=>e.c);if(cs.length)h+=`<h3>تبصره</h3>`+cs.reverse().map(e=>`<div><span class="chip num" style="min-width:0;height:24px">${e.ov}</span> ${esc(e.c)}</div>`).join('');h+='</div>'});
 return h+`<div class="row"><button class="b s" data-a="go" data-v="home">🏠 کور</button>${!c?`<button class="b s g" data-a="go" data-v="score">▶ دوام</button>`:''}</div>`}
const hist=()=>`<h2>پخوانۍ لوبې</h2>`+(S.m.length?[...S.m].reverse().map(m=>`<div class="card"><b>${esc(m.t[0].n)} v ${esc(m.t[1].n)}</b><div class="mut">${new Date(m.d).toLocaleDateString()}</div>${m.inn.map(n=>`<div>${esc(m.t[n.bat].n)} <b class="num">${n.runs}/${n.wk}</b></div>`).join('')}<div style="color:var(--o)">${m.stat==='done'?esc(m.res):'🔴 روانه لوبه'}</div><div class="row" style="margin-top:8px"><button class="b s" data-a="view" data-v="${m.id}">سکورکارډ</button>${m.stat!=='done'?`<button class="b s g" data-a="res" data-v="${m.id}">دوام</button>`:''}<button class="b s r" data-a="del" data-v="${m.id}">حذف</button></div></div>`).join(''):'<p class="mut">لا تر اوسه هیڅ لوبه نشته.</p>')+`<button class="b s" data-a="go" data-v="home">🏠 کور</button>`;
function stats(){const d=S.m.filter(m=>m.stat==='done'),tm={},bat={},bowl={};
 const mg=(dst,src,f)=>Object.entries(src).forEach(([k,v])=>{const o=dst[k]||(dst[k]=Object.assign({},v,...f.map(x=>({[x]:0}))));f.forEach(x=>o[x]+=v[x])});
 d.forEach(m=>{m.t.forEach((t,i)=>{const x=tm[t.n]||(tm[t.n]={p:0,w:0,l:0,t:0});x.p++;if(m.win===i)x.w++;else if(m.win===-1)x.t++;else x.l++});const g=agg(m);mg(bat,g.bat,['r','b']);mg(bowl,g.bowl,['b','r','w'])});
 const tb=Object.values(bat).sort((a,b)=>b.r-a.r).slice(0,5),tw=Object.values(bowl).sort((a,b)=>b.w-a.w||a.r-b.r).slice(0,5);
 return `<h2>احصایې</h2>`+(d.length?`<div class="card"><h3>ټیمونه</h3><table><tr><th>ټیم</th><th>P</th><th>W</th><th>L</th><th>T</th></tr>${Object.entries(tm).sort((a,b)=>b[1].w-a[1].w).map(([k,x])=>`<tr><td>${esc(k)}</td><td>${x.p}</td><td>${x.w}</td><td>${x.l}</td><td>${x.t}</td></tr>`).join('')}</table></div>
<div class="card"><h3>غوره بیټسمینان</h3><table><tr><th>نوم</th><th>R</th><th>B</th></tr>${tb.map(x=>`<tr><td>${esc(x.n)}<div class="mut">${esc(x.t)}</div></td><td><b>${x.r}</b></td><td>${x.b}</td></tr>`).join('')}</table></div>
<div class="card"><h3>غوره بالران</h3><table><tr><th>نوم</th><th>W</th><th>R</th><th>O</th></tr>${tw.map(x=>`<tr><td>${esc(x.n)}<div class="mut">${esc(x.t)}</div></td><td><b>${x.w}</b></td><td>${x.r}</td><td>${ov(x.b)}</td></tr>`).join('')}</table></div>`:'<p class="mut">لا تر اوسه هیڅ بشپړه لوبه نشته.</p>')+`<button class="b s" data-a="go" data-v="home">🏠 کور</button>`}
R();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
